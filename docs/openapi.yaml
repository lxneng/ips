openapi: 3.1.0
info:
  title: ips IP Geolocation API
  version: 1.1.0
  description: Offline IPv4 and IPv6 geolocation backed by local ip2region databases.
servers:
  - url: http://127.0.0.1:18080
paths:
  /:
    get:
      operationId: lookupClientIP
      summary: Look up the reported client address
      description: Uses the first X-Forwarded-For address when present and otherwise uses the current connection address. The forwarding header is trusted directly and may be spoofed unless an upstream proxy overwrites it.
      parameters:
        - name: X-Forwarded-For
          in: header
          required: false
          description: Comma-separated proxy chain whose first value is used as the client IP address.
          schema:
            type: string
          example: 203.0.113.8, 172.22.0.1
      responses:
        '200':
          description: Lookup completed. Unavailable location fields are returned as empty strings.
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlates the response with structured service logs.
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Prevents storage of this client-specific response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      operationId: lookupIPBatch
      summary: Look up multiple IP addresses
      description: Separates successful and failed items while retaining relative input order within each array. Item errors do not stop the remaining lookups.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchLookupRequest'
            example: [8.8.8.8, 1.1.1.1, '2001:4860:4860::8888']
      responses:
        '200':
          description: The batch was accepted and includes an overall success status.
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlates the response with structured service logs.
            Cache-Control:
              schema:
                type: string
                const: no-store
              description: Prevents storage of the batch response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchLookupResponse'
        '400':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    head:
      operationId: inspectClientIP
      summary: Return lookup status and headers for the reported client address
      parameters:
        - name: X-Forwarded-For
          in: header
          required: false
          description: Comma-separated proxy chain whose first value is used as the client IP address.
          schema:
            type: string
      responses:
        '200':
          description: Lookup completed without a response body.
        default:
          description: Uses the same status codes as GET without a response body.
  /{ip}:
    get:
      operationId: lookupIP
      summary: Look up an IP address
      parameters:
        - name: ip
          in: path
          required: true
          description: One IPv4 or IPv6 address without a port, CIDR prefix, or zone identifier.
          schema:
            type: string
          example: 8.8.8.8
      responses:
        '200':
          description: Lookup completed. Unavailable location fields are returned as empty strings.
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Correlates the response with structured service logs.
            Cache-Control:
              schema:
                type: string
                const: public, max-age=3600
              description: Allows this deterministic response to be cached for one hour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '405':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    head:
      operationId: inspectIP
      summary: Return lookup status and headers for an IP address
      parameters:
        - name: ip
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lookup completed without a response body.
        default:
          description: Uses the same status codes as GET without a response body.
  /healthz:
    get:
      operationId: health
      summary: Check process liveness
      responses:
        '200':
          $ref: '#/components/responses/Status'
  /readyz:
    get:
      operationId: ready
      summary: Check service readiness
      responses:
        '200':
          $ref: '#/components/responses/Status'
        '503':
          $ref: '#/components/responses/Error'
components:
  schemas:
    BatchLookupRequest:
      type: array
      minItems: 1
      maxItems: 1000
      items:
        type: string
        description: One IPv4 or IPv6 address without a port, CIDR prefix, or zone identifier.
    BatchLookupResponse:
      type: object
      required: [status, successes, failures]
      properties:
        status:
          type: string
          enum: [success, partial_success, failed]
        successes:
          type: array
          items:
            $ref: '#/components/schemas/LookupResponse'
        failures:
          type: array
          items:
            $ref: '#/components/schemas/BatchErrorResponse'
    BatchErrorResponse:
      type: object
      required: [ip, error]
      properties:
        ip:
          type: string
          description: Original input value.
        error:
          $ref: '#/components/schemas/ErrorDetail'
    LookupResponse:
      type: object
      required: [ip, ip_version, country, province, city, isp, country_code]
      properties:
        ip:
          type: string
          description: Normalized lookup address.
        ip_version:
          type: integer
          enum: [4, 6]
        country:
          type: string
        province:
          type: string
        city:
          type: string
        isp:
          type: string
        country_code:
          type: string
          description: Two-letter country or region code.
    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_request, invalid_ip, ip_not_found, route_not_found, method_not_allowed, batch_too_large, request_too_large, unsupported_media_type, internal_error, not_ready]
        message:
          type: string
  responses:
    Error:
      description: The request failed. The response body contains a stable machine-readable code.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Error responses are not cached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Status:
      description: The health check completed successfully.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
          description: Operational status responses are not cached.
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [ok, ready]
